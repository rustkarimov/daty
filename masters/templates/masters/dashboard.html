{% extends 'masters/base.html' %}
{% load static %}

{% block extra_css %}
   
{% endblock %}

{% block title %}Личный кабинет - {{ master.first_name }} {{ master.last_name }}{% endblock %}

{% block content %}

<div id="react-dashboard"
     data-master-slug="{{ master.public_slug }}"
     data-master-max-link="{{ master.max_link|default:'' }}"
     data-master-mode="{{ master.work_mode }}"
     data-total-bookings="{{ total_bookings }}"
     data-total-services="{{ total_services }}"
     data-total-clients="{{ total_clients }}"
     data-public-link="{{ request.scheme }}://{{ request.get_host }}/{{ master.public_slug }}/"></div>

{% endblock %}
